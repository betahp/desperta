<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desperta — Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#B9A582; --cream-deep:#AA9670; --paper:#FFFDF9;
  --ink:#2A241B; --ink-soft:#4E4636; --ink-faint:#6B6252;
  --gold:#9C7A3C; --gold-deep:#6B4F26; --gold-pale:#D9C49A;
  --line:#8F856F; --line-soft:#C9C0AC;
}
*{box-sizing:border-box;}
body{margin:0; font-family:'Inter',sans-serif; color:var(--ink); background:var(--cream);}
.wrap{max-width:1000px; margin:0 auto; padding:0 0 60px;}
.hero{background:var(--paper); text-align:center; padding:40px 20px 30px; border-bottom:1px solid var(--line-soft);}
.hero img{max-height:140px; max-width:85%; width:auto; height:auto;}
.hero h1{font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500; font-size:30px; margin:14px 0 4px;}
.hero p{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);}
.hero .month{font-size:11px; letter-spacing:.06em; color:var(--ink-faint); margin-top:2px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; padding:30px 20px;}
.card{background:var(--paper); border:1px solid var(--gold-pale); border-radius:3px; overflow:hidden;}
.card .img{width:100%; aspect-ratio:1; background:var(--cream-deep); position:relative; overflow:hidden;}
.card .img img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.card .body{padding:18px 18px 20px; text-align:center;}
.card .serial{font-size:10px; letter-spacing:.14em; color:var(--gold); text-transform:uppercase;}
.card .name{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:22px; margin:6px 0 8px;}
.card .price{font-family:'Cormorant Garamond',serif; font-size:19px; color:var(--gold-deep); margin-bottom:10px;}
.card .mat{font-size:11px; color:var(--ink-soft); line-height:1.6; margin-bottom:8px;}
.card .guarantee{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
.card .guarantee.yes{color:var(--gold-deep);}
.state{min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px; flex-direction:column; gap:10px;}
.state h2{font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500;}
.state p{color:var(--ink-soft); font-size:13px; max-width:320px;}
.footer{text-align:center; padding:20px; font-size:11px; color:var(--ink-faint);}
</style>
</head>
<body>
<div id="root">
  <div class="state"><h2>Loading…</h2></div>
</div>

  storageBucket: "despertaapp-bc945.firebasestorage.app",

  appId: "1:77286060605:web:e61a40d2d75ccb5ec0f054"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function money(v){
  const n = parseFloat(v);
  if(isNaN(n)) return '';
  return 'R$' + n.toFixed(2);
}

function cardHTML(p){
  const img = p.img ? `<img src="${p.img}" alt="${p.nome}" loading="lazy">` : '';
  const guaranteeTxt = p.garantia==='sim' ? 'Warranty: Yes' : p.garantia==='nao' ? 'Warranty: No' : '';
  return `<div class="card">
    <div class="img">${img}</div>
    <div class="body">
      <div class="serial">${p.codigo||''}</div>
      <div class="name">${p.nome}</div>
      ${p.valor_venda ? `<div class="price">${money(p.valor_venda)}</div>` : ''}
      ${p.hipoalergenico ? `<div class="mat">${p.hipoalergenico}</div>` : ''}
      ${guaranteeTxt ? `<div class="guarantee ${p.garantia==='sim'?'yes':''}">${guaranteeTxt}</div>` : ''}
    </div>
  </div>`;
}
